<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hannah Moriones — BI & Data Analytics Partner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    /* ── DESIGN TOKENS ───────────────────────────────────────── */
    :root {
      --bg:        #0B0F19;
      --bg-card:   #111827;
      --bg-raised: #1A2234;
      --border:    #1F2D45;
      --border-light:#263450;
      --blue:      #4F7EF7;
      --blue-dim:  #1E3A6E;
      --blue-glow: rgba(79,126,247,0.12);
      --text:      #E8EDF5;
      --muted:     #6B7A99;
      --subtle:    #374461;
      --white:     #FFFFFF;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --serif:     'Playfair Display', Georgia, serif;
      --sans:      'Inter', system-ui, sans-serif;
      --mono:      'JetBrains Mono', monospace;
      --max:       1080px;
    }

    /* ── RESET ───────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; font-size: 16px; }
    body { font-family: var(--sans); background: var(--bg); color: var(--text); line-height: 1.6; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }
    ul { list-style: none; }

    /* ── LAYOUT ──────────────────────────────────────────────── */
    .wrap { max-width: var(--max); margin: 0 auto; padding: 0 28px; }

    /* ── NAV ─────────────────────────────────────────────────── */
    nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(11,15,25,0.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      display: flex; align-items: center; justify-content: space-between;
      height: 60px;
    }
    .nav-name {
      font-family: var(--serif);
      font-size: 15px;
      color: var(--white);
      letter-spacing: 0.01em;
    }
    .nav-name span { color: var(--blue); }
    .nav-links { display: flex; align-items: center; gap: 32px; }
    .nav-links a {
      font-size: 13px; font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.02em;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--text); }
    .nav-cta {
      font-size: 12px; font-weight: 600;
      font-family: var(--mono);
      color: var(--blue) !important;
      border: 1px solid var(--blue-dim);
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      transition: background 0.2s, color 0.2s !important;
    }
    .nav-cta:hover { background: var(--blue-glow) !important; color: var(--blue) !important; }

    /* ── HERO ────────────────────────────────────────────────── */
    .hero { padding: 88px 0 72px; }
    .hero-label {
      font-family: var(--mono);
      font-size: 11px; font-weight: 500;
      color: var(--blue);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 22px;
    }
    .hero-name {
      font-family: var(--serif);
      font-size: clamp(2.6rem, 5.5vw, 4rem);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.01em;
      color: var(--white);
      margin-bottom: 10px;
    }
    .hero-title {
      font-size: 1rem; font-weight: 400;
      color: var(--muted);
      letter-spacing: 0.01em;
      margin-bottom: 28px;
    }
    .hero-summary {
      font-size: 1rem; font-weight: 300;
      color: #9BACC8;
      max-width: 620px;
      line-height: 1.8;
      margin-bottom: 40px;
      text-align: justify;
    }
    .hero-actions { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
    .btn-solid {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--blue);
      color: #fff;
      font-size: 13px; font-weight: 600;
      padding: 11px 22px;
      border-radius: var(--radius-sm);
      transition: opacity 0.2s;
      letter-spacing: 0.02em;
    }
    .btn-solid:hover { opacity: 0.88; }
    .btn-ghost {
      display: inline-flex; align-items: center; gap: 8px;
      border: 1px solid var(--border-light);
      color: var(--muted);
      font-size: 13px; font-weight: 500;
      padding: 11px 22px;
      border-radius: var(--radius-sm);
      transition: border-color 0.2s, color 0.2s;
      letter-spacing: 0.02em;
    }
    .btn-ghost:hover { border-color: var(--blue-dim); color: var(--text); }

    /* ── IMPACT METRICS BAR ──────────────────────────────────── */
    .metrics-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      margin: 56px 0 0;
      background: var(--bg-card);
    }
    .metric-item {
      padding: 28px 24px;
      border-right: 1px solid var(--border);
      position: relative;
    }
    .metric-item:last-child { border-right: none; }
    .metric-num {
      font-family: var(--serif);
      font-size: 2.4rem;
      font-weight: 700;
      color: var(--white);
      line-height: 1;
      margin-bottom: 6px;
    }
    .metric-num span { color: var(--blue); font-size: 1.4rem; }
    .metric-label {
      font-size: 12px; font-weight: 500;
      color: var(--muted);
      line-height: 1.4;
      letter-spacing: 0.01em;
    }

    /* ── SECTION STRUCTURE ───────────────────────────────────── */
    .section { padding: 80px 0; }
    .section + .section { border-top: 1px solid var(--border); }
    .section-header { margin-bottom: 48px; }
    .eyebrow {
      font-family: var(--mono);
      font-size: 11px; font-weight: 500;
      color: var(--blue);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .section-title {
      font-family: var(--serif);
      font-size: 1.9rem; font-weight: 700;
      color: var(--white);
      letter-spacing: -0.01em;
      margin-bottom: 8px;
    }
    .section-desc {
      font-size: 0.9rem; font-weight: 300;
      color: var(--muted);
      max-width: 500px;
      line-height: 1.7;
      text-align: justify;
    }

    /* ── PROJECT CARDS ───────────────────────────────────────── */
    .projects { display: flex; flex-direction: column; gap: 2px; border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
    .project-row {
      display: grid;
      grid-template-columns: 340px 1fr;
      min-height: 280px;
      background: var(--bg-card);
      transition: background 0.2s;
    }
    .project-row:hover { background: var(--bg-raised); }
    .project-row + .project-row { border-top: 1px solid var(--border); }
    .project-row.flip { direction: rtl; }
    .project-row.flip > * { direction: ltr; }

    .proj-media {
      overflow: hidden;
      position: relative;
      background: var(--bg);
    }
    .proj-media img {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
      filter: brightness(0.85) saturate(0.9);
    }
    .project-row:hover .proj-media img { transform: scale(1.04); filter: brightness(1) saturate(1); }
    .proj-media-placeholder {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 10px;
    }
    .proj-media-icon {
      width: 48px; height: 48px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
    }
    .proj-media-icon svg { width: 22px; height: 22px; }
    .proj-media-label {
      font-family: var(--mono);
      font-size: 10px; font-weight: 500;
      color: var(--subtle);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .proj-content {
      padding: 36px 40px;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .proj-platform {
      font-family: var(--mono);
      font-size: 10px; font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .p-tableau { color: #0094C9; }
    .p-looker  { color: #5C85E6; }
    .p-powerbi { color: #E8B800; }
    .p-python  { color: #4F7EF7; }

    .proj-title {
      font-family: var(--serif);
      font-size: 1.25rem; font-weight: 700;
      color: var(--white);
      line-height: 1.25;
      margin-bottom: 12px;
    }
    .proj-desc {
      font-size: 0.85rem; font-weight: 300;
      color: var(--muted);
      line-height: 1.75;
      margin-bottom: 20px;
      text-align: justify;
    }
    .proj-highlights { margin-bottom: 24px; }
    .proj-highlight {
      font-size: 12px; font-weight: 400;
      color: #7A93B8;
      padding: 3px 0 3px 14px;
      position: relative;
      line-height: 1.6;
    }
    .proj-highlight::before {
      content: '›';
      position: absolute; left: 0;
      color: var(--blue);
      font-weight: 600;
    }
    .proj-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 28px; }
    .tag {
      font-family: var(--mono);
      font-size: 10px; font-weight: 500;
      color: var(--muted);
      background: var(--bg-raised);
      border: 1px solid var(--border);
      padding: 3px 9px;
      border-radius: 4px;
      letter-spacing: 0.03em;
    }
    .proj-link {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 12px; font-weight: 600;
      color: var(--blue);
      font-family: var(--mono);
      letter-spacing: 0.03em;
      transition: opacity 0.2s;
    }
    .proj-link:hover { opacity: 0.75; }
    .proj-link svg { width: 12px; height: 12px; }

    /* ── EXPERIENCE TIMELINE ─────────────────────────────────── */
    .timeline { position: relative; padding-left: 28px; }
    .timeline::before {
      content: '';
      position: absolute; left: 0; top: 8px; bottom: 8px;
      width: 1px;
      background: linear-gradient(to bottom, var(--blue) 0%, var(--border) 100%);
    }
    .tl-item { position: relative; padding-bottom: 44px; }
    .tl-item:last-child { padding-bottom: 0; }
    .tl-dot {
      position: absolute; left: -33px; top: 6px;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 2px solid var(--blue-dim);
      transition: border-color 0.2s;
    }
    .tl-item:first-child .tl-dot { border-color: var(--blue); background: var(--blue); }
    .tl-meta {
      font-family: var(--mono);
      font-size: 11px; font-weight: 500;
      color: var(--blue);
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }
    .tl-role {
      font-size: 1rem; font-weight: 600;
      color: var(--white);
      margin-bottom: 2px;
    }
    .tl-company {
      font-size: 0.85rem; font-weight: 400;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .tl-bullets { display: flex; flex-direction: column; gap: 6px; }
    .tl-bullet {
      font-size: 13px; font-weight: 300;
      color: #7A93B8;
      padding-left: 14px;
      position: relative;
      line-height: 1.65;
      text-align: justify;
    }
    .tl-bullet::before {
      content: '›';
      position: absolute; left: 0;
      color: var(--subtle);
      font-weight: 600;
    }
    .tl-bullet strong { color: var(--text); font-weight: 500; }

    /* ── SKILLS GRID ─────────────────────────────────────────── */
    .skills-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .skill-group {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 24px 26px;
    }
    .skill-group-title {
      font-family: var(--mono);
      font-size: 10px; font-weight: 500;
      color: var(--blue);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .skill-pills { display: flex; flex-wrap: wrap; gap: 7px; }
    .skill-pill {
      font-size: 12px; font-weight: 400;
      color: var(--text);
      background: var(--bg-raised);
      border: 1px solid var(--border-light);
      padding: 5px 12px;
      border-radius: 20px;
    }

    /* ── FOOTER ──────────────────────────────────────────────── */
    footer {
      border-top: 1px solid var(--border);
      padding: 28px 0;
      margin-top: 80px;
    }
    .footer-inner {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 10px;
    }
    .footer-copy { font-size: 12px; color: var(--subtle); font-family: var(--mono); }
    .footer-right { display: flex;
